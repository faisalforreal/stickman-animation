[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stickman-anim"
version = "0.2.0"
description = "Hand-drawn, stop-motion style stickman animations (GIF / MP4) for explaining workflows, drawn with Pillow."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ittahaduzzaman Akash" }]
keywords = ["animation", "stickman", "stop-motion", "gif", "explainer", "diagrams", "pillow"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Graphics",
]
dependencies = ["Pillow>=10.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
stickman = "stickman_anim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
