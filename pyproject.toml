[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stickman-anim"
version = "0.3.0"
description = "Hand-drawn, stop-motion style stickman animations (GIF / MP4) with flexible TTS narration and styled captions, drawn with Pillow."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ittahaduzzaman Akash" }]
keywords = ["animation", "stickman", "stop-motion", "gif", "explainer", "diagrams", "pillow", "tts", "captions"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "Pillow>=10.1",
  "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
stickman = "stickman_anim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stickman_anim = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
