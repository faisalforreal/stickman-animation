name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System packages (ffmpeg for MP4 tests, fonts)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation fonts-freefont-ttf libraqm0
      - run: pip install -e ".[dev]"
      - run: pytest -q
